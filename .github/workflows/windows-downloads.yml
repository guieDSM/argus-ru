name: Windows downloads

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-downloads
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/check.yml

  windows:
    name: Build and test Windows downloads
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_TERM_COLOR: always
      ARGUS_LOCALE: ru-RU
      ARGUS_BUILD_METADATA: personal-ru.${{ github.run_number }}.g${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Install Rust and NSIS
        run: |
          rustup toolchain install stable-x86_64-pc-windows-msvc --profile minimal --no-self-update
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default stable-x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          choco install nsis --version=3.13 -y --no-progress
          exit $LASTEXITCODE
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build the application, installer and window probe
        run: |
          node scripts/build.mjs --installer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --release --locked -p argus-window-probe --features capture
          exit $LASTEXITCODE
      - name: Test installation, update detection and uninstallation
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content resources/app.json -Raw | ConvertFrom-Json).version
          $setups = @(Get-ChildItem target/release/bundle/nsis/*-setup.exe)
          if ($setups.Count -ne 1) { throw 'Expected exactly one installer' }
          $dir = Join-Path $env:RUNNER_TEMP 'argus-ru-install-test'
          $key = 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Argus'
          $process = Start-Process $setups[0].FullName -ArgumentList '/S', "/D=$dir" -WindowStyle Hidden -PassThru
          if (-not $process.WaitForExit(60000)) { $process.Kill(); throw 'Installation timed out' }
          if ($process.ExitCode -ne 0) { throw "Installation failed: $($process.ExitCode)" }
          foreach ($file in 'argus.exe', 'uninstall.exe') {
            if (-not (Test-Path (Join-Path $dir $file))) { throw "Missing installed file: $file" }
          }
          $entry = Get-ItemProperty $key
          if ($entry.DisplayVersion -ne $version) { throw 'Incorrect installed version' }
          if ($entry.Publisher -ne 'Argus contributors') { throw 'Incorrect publisher' }
          if ((Get-FileHash (Join-Path $dir 'argus.exe')).Hash -ne (Get-FileHash target/release/argus.exe).Hash) {
            throw 'The installed application differs from the portable download'
          }
          function Assert-UpdateKind($exe, $expected) {
            $probe = Start-Process $exe -ArgumentList '--argus-updater-check' -WindowStyle Hidden -PassThru
            if (-not $probe.WaitForExit(30000)) { $probe.Kill(); throw 'Update detection timed out' }
            if ($probe.ExitCode -ne $expected) { throw "Incorrect update detection for $exe" }
          }
          Assert-UpdateKind (Join-Path $dir 'argus.exe') 0
          Assert-UpdateKind (Resolve-Path target/release/argus.exe).Path 1
          Start-Process (Join-Path $dir 'uninstall.exe') -ArgumentList '/S' -WindowStyle Hidden -Wait
          $deadline = (Get-Date).AddSeconds(60)
          while (((Test-Path $key) -or (Test-Path (Join-Path $dir 'argus.exe'))) -and (Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 1
          }
          if (Test-Path $key) { throw 'Uninstall entry remains after uninstallation' }
          if (Test-Path (Join-Path $dir 'argus.exe')) { throw 'Application remains after uninstallation' }
      - name: Check the Russian interface in an isolated profile
        run: |
          # Hosted Windows runners cannot capture frames with Windows.Graphics.Capture.
          # Inspect the real window layout and dialogs, as in personal-ru.yml.
          $plan = Get-Content tools/window-probe/steps/localization.json -Raw | ConvertFrom-Json
          $index = 0
          foreach ($step in $plan.steps) {
            $index++
            $step.PSObject.Properties.Remove('capture')
            if (-not $step.inspect) {
              $step | Add-Member -NotePropertyName inspect -NotePropertyValue layout
              $step | Add-Member -NotePropertyName label -NotePropertyValue "page-$index"
              if ($step.control.page) {
                $step | Add-Member -NotePropertyName expect -NotePropertyValue @{page=$step.control.page}
              }
            }
          }
          $plan | ConvertTo-Json -Depth 50 | Set-Content target/windows-ru-ui-ci.json -Encoding utf8
          node scripts/ui-shots.mjs windows-ru target/windows-ru-ui-ci.json --release --language ru-RU
          exit $LASTEXITCODE
      - name: Collect public downloads
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path delivery | Out-Null
          Copy-Item target/release/bundle/nsis/*-setup.exe delivery/Argus-RU-setup.exe
          Copy-Item target/release/argus.exe delivery/Argus-RU.exe
          Copy-Item LICENSE, THIRD-PARTY-NOTICES.txt -Destination delivery
          Copy-Item target/native-validation/windows-ru/results.json delivery/interface-checks.json
          @{
            repository = '${{ github.repository }}'
            commit = '${{ github.sha }}'
            workflow = '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
            upstream = 'https://github.com/Ray-lea/Argus'
            version = (Get-Content resources/app.json -Raw | ConvertFrom-Json).version
            buildMetadata = $env:ARGUS_BUILD_METADATA
            architecture = 'x64'
            configuration = 'Release'
          } | ConvertTo-Json | Set-Content delivery/build-info.json -Encoding utf8
          Get-ChildItem delivery/*.exe | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content delivery/SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-downloads
          path: delivery/
          if-no-files-found: error
          retention-days: 3

  publish:
    name: Publish Windows downloads
    needs: [check, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-downloads
          path: delivery
      - name: Publish the tested installer and portable application
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: windows-ru-${{ github.run_number }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          gh release create "$RELEASE_TAG" delivery/* --target "$RELEASE_COMMIT" --latest \
            --title "Argus RU — Windows x64 (сборка ${{ github.run_number }})" \
            --notes-file personal/WINDOWS-RELEASE.ru.md
