name: Personal Russian build

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: personal-ru
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_TERM_COLOR: always
      ARGUS_LOCALE: ru-RU
      ARGUS_BUILD_METADATA: personal-ru.${{ github.run_number }}.g${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Install Rust
        run: |
          rustup toolchain install stable-x86_64-pc-windows-msvc --profile minimal --no-self-update
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default stable-x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true
      - name: Check translation catalogs and generated adapters
        run: |
          node scripts/i18n.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/native-dispatch.mjs --check
          exit $LASTEXITCODE
      - name: Test locale resolution, catalogs and plural forms
        run: cargo test --release --locked -p argus-core i18n::tests
      - name: Build native application and window probe
        run: |
          node scripts/build.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --release --locked -p argus-window-probe --features capture
          exit $LASTEXITCODE
      - name: Collect application and source information
        run: |
          New-Item -ItemType Directory -Path delivery | Out-Null
          Copy-Item target/release/argus.exe delivery/Argus-RU.exe
          Copy-Item target/release/argus-window-probe.exe delivery/argus-window-probe.exe
          Copy-Item personal/install.ps1, personal/README.ru.md, LICENSE, THIRD-PARTY-NOTICES.txt -Destination delivery
          @{
            repository = '${{ github.repository }}'
            commit = '${{ github.sha }}'
            upstream = 'https://github.com/Ray-lea/Argus'
            locale = 'ru-RU'
            configuration = 'Release'
          } | ConvertTo-Json | Set-Content delivery/build-info.json -Encoding utf8
          Get-FileHash delivery/Argus-RU.exe -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLowerInvariant())  Argus-RU.exe" } |
            Set-Content delivery/SHA256SUMS.txt -Encoding ascii
      - name: Save application in a private draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Compress-Archive -Path delivery/* -DestinationPath Argus-RU-Windows-x64.zip
          gh release create personal-ru-${{ github.run_number }} Argus-RU-Windows-x64.zip --draft --target '${{ github.sha }}' --title 'Argus RU personal build ${{ github.run_number }}' --notes-file personal/README.ru.md
          exit $LASTEXITCODE
      - name: Check Russian interface in an isolated profile
        run: |
          # Hosted Windows runners can create the app window but do not support
          # Windows.Graphics.Capture. Inspect real layout and dialogs instead.
          $plan = Get-Content tools/window-probe/steps/localization.json -Raw | ConvertFrom-Json
          $index = 0
          foreach ($step in $plan.steps) {
            $index++
            $step.PSObject.Properties.Remove('capture')
            if (-not $step.inspect) {
              $step | Add-Member -NotePropertyName inspect -NotePropertyValue layout
              $step | Add-Member -NotePropertyName label -NotePropertyValue "page-$index"
              if ($step.control.page) {
                $step | Add-Member -NotePropertyName expect -NotePropertyValue @{page=$step.control.page}
              }
            }
          }
          $plan | ConvertTo-Json -Depth 50 | Set-Content target/personal-ui-ci.json -Encoding utf8
          node scripts/ui-shots.mjs personal-ru target/personal-ui-ci.json --release --language ru-RU
          exit $LASTEXITCODE
      - name: Save interface check results
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if (Test-Path target/native-validation/personal-ru/results.json) {
            gh release upload personal-ru-${{ github.run_number }} target/native-validation/personal-ru/results.json --clobber
            exit $LASTEXITCODE
          }
