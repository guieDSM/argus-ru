name: Personal Russian build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: personal-ru
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_TERM_COLOR: always
      ARGUS_LOCALE: ru-RU
      ARGUS_BUILD_METADATA: personal-ru.${{ github.run_number }}.g${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Install Rust
        run: |
          rustup toolchain install stable-x86_64-pc-windows-msvc --profile minimal --no-self-update
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default stable-x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Check translation catalogs and generated adapters
        run: |
          node scripts/i18n.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/native-dispatch.mjs --check
          exit $LASTEXITCODE
      - name: Test locale resolution, catalogs and plural forms
        run: cargo test --release --locked -p argus-core i18n::tests
      - name: Build native application and window probe
        run: |
          node scripts/build.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --release --locked -p argus-window-probe --features capture
          exit $LASTEXITCODE
      - name: Check Russian interface in an isolated profile
        run: node scripts/ui-shots.mjs personal-ru tools/window-probe/steps/localization.json --release --language ru-RU
      - name: Collect application and source information
        run: |
          New-Item -ItemType Directory -Path delivery | Out-Null
          Copy-Item target/release/argus.exe delivery/Argus-RU.exe
          Copy-Item target/release/argus-window-probe.exe delivery/argus-window-probe.exe
          Copy-Item personal/install.ps1, personal/README.ru.md, LICENSE -Destination delivery
          @{
            repository = '${{ github.repository }}'
            commit = '${{ github.sha }}'
            upstream = 'https://github.com/Ray-lea/Argus'
            locale = 'ru-RU'
            configuration = 'Release'
          } | ConvertTo-Json | Set-Content delivery/build-info.json -Encoding utf8
          Get-FileHash delivery/Argus-RU.exe -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLowerInvariant())  Argus-RU.exe" } |
            Set-Content delivery/SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Argus-RU-Windows-x64
          path: delivery/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: Russian-interface-check
          path: target/native-validation/personal-ru/
          if-no-files-found: ignore
          retention-days: 14
